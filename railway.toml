# Railway service settings. These override the dashboard.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs after the build and before the new version starts. If it fails, the deploy stops.
preDeployCommand = ["node apps/bot/src/migrate.ts"]
# No startCommand: the Dockerfile's CMD starts Node as PID 1, so it gets SIGTERM directly.
# Shutdown waits up to 10 s for scheduled jobs, then closes Discord and the database.
drainingSeconds = 20
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Exactly one copy, in Amsterdam near the Supabase database (eu-west-1). A second copy would
# answer every command twice.
multiRegionConfig = { "europe-west4-drams3a" = { numReplicas = 1 } }
