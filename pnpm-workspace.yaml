packages:
  - apps/*
  - packages/*

# Refuse package versions published less than a day ago (in minutes).
minimumReleaseAge: 1440

catalog:
  "@anthropic-ai/sdk": 0.137.0
  csv-parse: 7.0.3
  discord-api-types: 0.38.57
  discord.js: 14.27.0
  drizzle-orm: 0.45.4
  fast-xml-parser: 5.11.2
  pino: 10.4.0
  postgres: 3.4.9
  zod: 4.6.7

allowBuilds:
  # drizzle-kit loads the schema with esbuild; its install script checks the platform binary.
  esbuild: true
  # lefthook installs its hooks through the root "prepare" script instead.
  lefthook: false
