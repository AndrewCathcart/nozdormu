packages:
  - apps/*
  - packages/*

# Refuse package versions published less than a day ago (in minutes).
minimumReleaseAge: 1440

catalog:
  discord-api-types: 0.38.55
  discord.js: 14.27.0
  pino: 10.3.1
  zod: 4.6.5

# lefthook installs its hooks through the root "prepare" script instead.
allowBuilds:
  lefthook: false
